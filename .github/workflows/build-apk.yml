name: Build Yap APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Yap-v1.5.8-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare Android signing tools
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/
      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-36
          path: signing-tools
          if-no-files-found: error
          retention-days: 1
